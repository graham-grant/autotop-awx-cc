---
# Stage 1: read-only data gathering only. Logs in to each device in
# `network_devices` with scripts/collect.py, writes one JSON facts file per
# device to output/facts/, then checks every file. It builds no diagram and
# copies nothing anywhere unless `artifact_facts_dir` is set.
#
# It uses exactly the collection code gather_topology.yml uses, with every
# read-only safeguard (scripts/readonly.py, sshcli.py, audit.py):
#   Play 1  print the read-only command plan for each platform in the
#           inventory; stop before any device is contacted if a command
#           would be refused
#   Play 2  collect, after checking the host's platform is enabled for
#           this stage (`collect_platforms`); hosts run in parallel up to
#           the job's forks
#   Play 3  optional: copy the facts files to the artifact server
#   Play 4  audit every line sent (audit.py) and check every facts file's
#           JSON (check_facts.py); fail the job on any problem
# A host that fails is marked failed and the others carry on. If every
# host fails, Ansible stops after play 2: the job log shows why.
#
# Variables (extra vars in AWX, or -e by hand):
#   collect_platforms   platforms this stage may contact (default: [ios])
#   show_facts          true: print each facts file, without its raw output
#                       and audit, in the job log (default: false)
#   artifact_facts_dir  copy output/facts/ here on the artifact server
#                       (default: unset, nothing is copied)
#
# Usage:
#   export NET_USERNAME=admin
#   export NET_PASSWORD=secret
#   ansible-playbook -i inventory.yml playbooks/collect_facts.yml --limit 9200-1

- name: Prepare output and check the read-only command plan
  hosts: localhost
  connection: local
  gather_facts: no
  vars:
    facts_dir: "{{ playbook_dir }}/../output/facts"
    inventory_platforms: "{{ groups['network_devices'] | default([]) | map('extract', hostvars, 'ansible_network_os') | unique | list }}"
  tasks:
    - name: Check there are devices to collect
      assert:
        that: groups['network_devices'] | default([]) | length > 0
        fail_msg: "No hosts in the network_devices group. Check the inventory."
        quiet: true

    - name: Ensure output/facts directory exists
      file:
        path: "{{ facts_dir }}"
        state: directory
        mode: "0755"

    # This job checks the files it writes, so files from an earlier run on
    # the same controller are removed first.
    - name: Find facts files from an earlier run
      find:
        paths: "{{ facts_dir }}"
        patterns: "*.json"
      register: old_facts

    - name: Remove facts files from an earlier run
      file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ old_facts.files }}"
      loop_control:
        label: "{{ item.path | basename }}"

    # Every command collection will send must pass the platform's read-only
    # policy before any device is contacted. The plan is printed so the job
    # log shows exactly what will be run.
    - name: Check the read-only command plan for each platform
      command: python3 collect.py --plan --platform {{ item }}
      args:
        chdir: "{{ playbook_dir }}/../scripts"
      loop: "{{ inventory_platforms }}"
      register: command_plan
      changed_when: false

    - name: Show the read-only command plan
      debug:
        msg: "{{ command_plan.results | map(attribute='stdout_lines') | list }}"

- name: Collect show-command output, read-only
  hosts: network_devices
  # collect.py does the SSH itself, from the controller, through the system
  # ssh client and a pty (standard library only). Ansible never connects to
  # the device.
  connection: local
  gather_facts: no
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    # ansible_network_os spellings -> driver name, as in drivers._ALIASES
    platform_aliases:
      iosxe: ios
      ios-xe: ios
      cisco.ios.ios: ios
      pan-os: panos
      paloaltonetworks.panos: panos
      win: windows
    platform: "{{ platform_aliases[ansible_network_os | lower] | default(ansible_network_os | lower) }}"
  tasks:
    # A platform not yet enabled for this stage is never contacted, even
    # though the code supports it.
    - name: Check this device's platform is enabled for this stage
      assert:
        that: platform in (collect_platforms | default(['ios']))
        fail_msg: >-
          {{ inventory_hostname }} is {{ platform }}, which is not enabled
          for this stage (collect_platforms: {{ collect_platforms | default(['ios']) }}).
          It was not contacted.
        quiet: true

    - name: Check device credentials were provided
      assert:
        that: >-
          (net_username | length > 0 and net_password | length > 0)
          or (ansible_network_os == 'panos'
              and panos_username | length > 0 and panos_password | length > 0)
          or (ansible_network_os in ['windows', 'win']
              and windows_username | length > 0 and windows_password | length > 0)
        fail_msg: >-
          No device credentials in the job environment for this host. In
          AWX, attach a credential of the built-in "Network" type to this
          job template (it sets ANSIBLE_NET_USERNAME / ANSIBLE_NET_PASSWORD).
          Running by hand: export NET_USERNAME and NET_PASSWORD.
        quiet: true

    - name: Collect show-command output
      command: >-
        python3 {{ playbook_dir }}/../scripts/collect.py
        --name {{ inventory_hostname }}
        --host {{ ansible_host | default(inventory_hostname) }}
        {{ ('--port ' ~ ansible_port) if ansible_port is defined else '' }}
        --platform {{ ansible_network_os }}
        --out {{ playbook_dir }}/../output/facts/{{ inventory_hostname }}.json
        --ssh-args {{ net_ssh_args | default('') | quote }}
        {{ ('--panorama ' ~ panorama_host) if (panos_via_panorama | default(false) | bool) else '' }}
        {{ ('--serial ' ~ panos_serial) if (panos_via_panorama | default(false) | bool) and panos_serial is defined else '' }}
        {{ ('--ca-file ' ~ (panos_ca_file | quote)) if panos_ca_file is defined else '' }}
        {{ '--no-verify-tls' if not (panos_verify_tls | default(true) | bool) else '' }}
      # Credentials go to collect.py through the environment, never argv.
      environment:
        NET_USERNAME: "{{ net_username }}"
        NET_PASSWORD: "{{ net_password }}"
        NET_ENABLE_PASSWORD: "{{ net_enable_password }}"
        PANOS_USERNAME: "{{ panos_username }}"
        PANOS_PASSWORD: "{{ panos_password }}"
        WINDOWS_USERNAME: "{{ windows_username }}"
        WINDOWS_PASSWORD: "{{ windows_password }}"
      register: collect_result
      changed_when: false
      # Shown below whether it worked or not, then the host fails if it didn't
      failed_when: false

    - name: Show the commands sent to the device
      debug:
        msg: "{{ collect_result.stdout_lines + collect_result.stderr_lines }}"

    - name: Fail this host if collection failed
      assert:
        that: collect_result.rc == 0
        fail_msg: >-
          collect.py exited {{ collect_result.rc }} for this host (3 means a
          read-only safeguard stopped it or the configuration changed). See
          the lines above.
        quiet: true

- name: Copy the facts files to the artifact server (optional)
  hosts: artifact_server
  gather_facts: no
  tasks:
    - name: Copy facts directory to artifact server
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../output/facts/"
        dest: "{{ artifact_facts_dir }}/"
        mode: "0644"
      when: artifact_facts_dir is defined and artifact_facts_dir | length > 0

- name: Audit the commands sent and check the JSON
  hosts: localhost
  connection: local
  gather_facts: no
  vars:
    facts_dir: "{{ playbook_dir }}/../output/facts"
  tasks:
    - name: Audit the commands recorded in the facts files
      command: python3 audit.py {{ facts_dir }}
      args:
        chdir: "{{ playbook_dir }}/../scripts"
      register: audit_result
      changed_when: false
      failed_when: false

    - name: Show the read-only audit
      debug:
        var: audit_result.stdout_lines

    - name: Check every facts file's JSON
      command: python3 check_facts.py {{ facts_dir }}
      args:
        chdir: "{{ playbook_dir }}/../scripts"
      register: check_result
      changed_when: false
      failed_when: false

    - name: Show the facts check
      debug:
        msg: "{{ check_result.stdout_lines + check_result.stderr_lines }}"

    - name: Find the facts files
      find:
        paths: "{{ facts_dir }}"
        patterns: "*.json"
      register: facts_files
      when: show_facts | default(false) | bool

    - name: Show each facts file without its raw output and audit
      debug:
        msg: "{{ lookup('file', item.path) | from_json | dict2items | rejectattr('key', 'in', ['raw', 'audit']) | list | items2dict }}"
      loop: "{{ facts_files.files | default([]) }}"
      loop_control:
        label: "{{ item.path | basename }}"
      when: show_facts | default(false) | bool

    - name: Fail the job if the audit found a problem
      assert:
        that: audit_result.rc == 0
        fail_msg: "Read-only audit failed - see the audit output above."
        quiet: true

    - name: Fail the job if a facts file is wrong
      assert:
        that: check_result.rc == 0
        fail_msg: "Facts check failed - see the CHECK output above."
        quiet: true
