# Settings scripts/collect.py uses to reach the devices (it runs on the
# controller and does the SSH itself - Ansible doesn't connect to them).
# Credentials (and the optional enable secret) come from group_vars/all.yml.

# Older images only offer legacy key exchange / host key algorithms;
# uncomment and adjust if SSH negotiation fails:
# net_ssh_args: "-o KexAlgorithms=+diffie-hellman-group14-sha1 -o HostKeyAlgorithms=+ssh-rsa"
