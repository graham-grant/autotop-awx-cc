---
# Gathers raw show-command output from every host in the `network_devices`
# group over SSH (scripts/collect.py - stdlib Python + the system ssh
# client; no NAPALM, no network collections, nothing to pip install), then
# writes one JSON file per host to output/facts/: the common device format
# (schema 2), parsed by the platform's driver (scripts/drivers/), with the
# raw output kept. scripts/main.py reads those files and draws the drawio
# diagram. Adjacency is derived from directly-connected subnets (two
# hosts with an IP in the same subnet are linked), not LLDP - see
# scripts/parser.py for why.
#
# Which commands get run is decided by scripts/commands.py: the core
# commands the platform's driver needs, plus the commands behind each facet
# an enabled feature plugin (scripts/features/) draws. Adding a feature
# never needs an edit here.
#
# Read-only: collection never changes a device. Play 1 prints the exact
# commands that will be sent per platform, checked against the read-only
# policy (scripts/readonly.py), and stops the job before any device is
# contacted if one would be refused. collect.py checks every command again
# as it is sent, logs each one, and compares the device's config-change
# marker before and after. The last play (scripts/audit.py) re-verifies
# every recorded command from the facts files and fails the job if anything
# was out of policy or a configuration changed.
#
# Usage:
#   export NET_USERNAME=admin
#   export NET_PASSWORD=secret
#   ansible-playbook -i inventory.yml playbooks/gather_topology.yml

- name: Prepare output directory and check the C extension
  hosts: localhost
  connection: local
  gather_facts: no
  tasks:
    - name: Ensure output/facts directory exists
      file:
        path: "{{ playbook_dir }}/../output/facts"
        state: directory
        mode: "0755"

    # The prebuilt scripts/_hanan.abi3.so is used as-is (no compiler
    # needed). Loading pathfinder here fails fast, before touching any
    # device, if it can't be loaded on this execution environment.
    - name: Check the C extension loads
      command: python3 -c "import pathfinder; print(pathfinder._hanan.__file__)"
      args:
        chdir: "{{ playbook_dir }}/../scripts"
      changed_when: false

    # Every platform in the inventory must have a read-only policy, and
    # every command collection will send must pass it, before any device
    # is contacted. The plan is printed so the job log shows exactly what
    # will be run.
    - name: Check the read-only command plan for each platform
      command: python3 collect.py --plan --platform {{ item }}
      args:
        chdir: "{{ playbook_dir }}/../scripts"
      loop: "{{ groups['network_devices'] | map('extract', hostvars, 'ansible_network_os') | unique | list }}"
      register: command_plan
      changed_when: false

    - name: Show the read-only command plan
      debug:
        msg: "{{ command_plan.results | map(attribute='stdout_lines') | list }}"

- name: Gather show-command output from all inventory devices
  hosts: network_devices
  # scripts/collect.py does the SSH itself, from the controller: it drives
  # the system ssh client through a pty (stdlib only) so it can answer
  # in-session "User Name:/Password:" prompts, pagers and "enable", which
  # ansible.builtin.raw can't. So Ansible itself never connects to the device.
  connection: local
  gather_facts: no
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  tasks:
    - name: Check device credentials were provided
      assert:
        that:
          - net_username | length > 0
          - net_password | length > 0
        fail_msg: >-
          No device credentials in the job environment. In AWX, attach a
          credential of the built-in "Network" type to this job template
          (it sets ANSIBLE_NET_USERNAME / ANSIBLE_NET_PASSWORD). Running by
          hand: export NET_USERNAME and NET_PASSWORD.
        quiet: true
      run_once: true

    - name: Collect show-command output over SSH
      command: >-
        python3 {{ playbook_dir }}/../scripts/collect.py
        --name {{ inventory_hostname }}
        --host {{ ansible_host | default(inventory_hostname) }}
        --port {{ ansible_port | default(22) }}
        --platform {{ ansible_network_os }}
        --out {{ playbook_dir }}/../output/facts/{{ inventory_hostname }}.json
        --ssh-args {{ net_ssh_args | default('') | quote }}
      # Credentials go to collect.py through the environment, never argv.
      environment:
        NET_USERNAME: "{{ net_username }}"
        NET_PASSWORD: "{{ net_password }}"
        NET_ENABLE_PASSWORD: "{{ net_enable_password }}"
      register: collect_result
      changed_when: false

    # Every line sent to the device, as collect.py logged it (the full
    # record is also in the facts file under "audit")
    - name: Show the commands sent to the device
      debug:
        var: collect_result.stdout_lines

- name: Push all gathered facts to artifact server
  hosts: artifact_server
  gather_facts: no
  tasks:
    - name: Copy facts directory to artifact server
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../output/facts/"
        dest: /home/hp/Projects/autotop-awx/output/facts/
        mode: "0755"

- name: Build the drawio diagram and publish it as a job artifact
  hosts: localhost
  connection: local
  gather_facts: no
  tasks:
    - name: Run main.py against the gathered facts
      command: >-
        python3 {{ playbook_dir }}/../scripts/main.py
        {{ playbook_dir }}/../output/facts
        {{ playbook_dir }}/../output
      register: build_result

    - name: Show build script output in the job log
      debug:
        var: build_result.stdout_lines

- name: Push generated diagram to artifact server
  hosts: artifact_server
  gather_facts: no
  tasks:
    - name: Copy topology.drawio to artifact server
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../output/topology.drawio"
        dest: /home/hp/Projects/autotop-awx/topology.drawio

- name: Verify every command sent was read-only
  hosts: localhost
  connection: local
  gather_facts: no
  tasks:
    # Re-checks each facts file's audit against the read-only policy and
    # the config-change result. Runs last, so the diagram is still
    # published, but fails the job if anything was out of policy.
    - name: Audit the commands recorded in the facts files
      command: >-
        python3 {{ playbook_dir }}/../scripts/audit.py
        {{ playbook_dir }}/../output/facts
      register: audit_result
      changed_when: false
      failed_when: false

    - name: Show the read-only audit
      debug:
        var: audit_result.stdout_lines

    - name: Fail the job if the audit found a problem
      assert:
        that: audit_result.rc == 0
        fail_msg: "Read-only audit failed - see the audit output above."
        quiet: true
