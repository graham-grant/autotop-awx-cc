---
# Gathers raw show-command output from every host in the `network_devices`
# group over plain SSH (ansible.builtin.raw - no NAPALM, no network
# collections, nothing to pip install), then writes one JSON file per host
# to output/facts/. scripts/main.py parses that output (scripts/netparse/)
# into the NAPALM-style schema the rest of the project uses and draws the
# drawio diagram. Adjacency is derived from directly-connected subnets (two
# hosts with an IP in the same subnet are linked), not LLDP - see
# scripts/parser.py for why.
#
# Which commands get run is decided by scripts/commands.py: the core
# commands netparse needs for the host's platform, plus whatever each
# enabled feature plugin (scripts/features/) asks for. Adding a feature
# never needs an edit here.
#
# Usage:
#   export NET_USERNAME=admin
#   export NET_PASSWORD=secret
#   ansible-playbook -i inventory.yml playbooks/gather_topology.yml

- name: Prepare output directory and check the C extension
  hosts: localhost
  connection: local
  gather_facts: no
  tasks:
    - name: Ensure output/facts directory exists
      file:
        path: "{{ playbook_dir }}/../output/facts"
        state: directory
        mode: "0755"

    # The prebuilt scripts/_hanan.abi3.so is used as-is (no compiler
    # needed). Loading pathfinder here fails fast, before touching any
    # device, if it can't be loaded on this execution environment.
    - name: Check the C extension loads
      command: python3 -c "import pathfinder; print(pathfinder._hanan.__file__)"
      args:
        chdir: "{{ playbook_dir }}/../scripts"
      changed_when: false

- name: Gather show-command output from all inventory devices
  hosts: network_devices
  gather_facts: no
  # SSH connection settings live in group_vars/network_devices.yml (not
  # play vars), so the tasks delegated to localhost below don't inherit them.
  tasks:
    - name: Work out which commands this platform needs
      command: python3 {{ playbook_dir }}/../scripts/commands.py {{ ansible_network_os }}
      delegate_to: localhost
      changed_when: false
      register: command_list

    - name: Run each show command
      ansible.builtin.raw: "{{ item }}"
      loop: "{{ command_list.stdout | from_json }}"
      register: cli_output
      changed_when: false
      # A feature's command failing (e.g. no crypto on this box) shouldn't
      # stop the core data from being collected.
      failed_when: false

    - name: Write this host's raw output to a JSON file
      copy:
        dest: "{{ playbook_dir }}/../output/facts/{{ inventory_hostname }}.json"
        content: "{{ node_record | to_nice_json }}"
      delegate_to: localhost
      vars:
        node_record:
          inventory_name: "{{ inventory_hostname }}"
          platform: "{{ ansible_network_os }}"
          # {command: output} for every command that succeeded
          cli: >-
            {{ dict(cli_output.results | selectattr('rc', 'equalto', 0) | map(attribute='item')
                    | zip(cli_output.results | selectattr('rc', 'equalto', 0) | map(attribute='stdout'))) }}

- name: Push all gathered facts to artifact server
  hosts: artifact_server
  gather_facts: no
  tasks:
    - name: Copy facts directory to artifact server
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../output/facts/"
        dest: /home/hp/Projects/autotop-awx/output/facts/
        mode: "0755"

- name: Build the drawio diagram and publish it as a job artifact
  hosts: localhost
  connection: local
  gather_facts: no
  tasks:
    - name: Run main.py against the gathered facts
      command: >-
        python3 {{ playbook_dir }}/../scripts/main.py
        {{ playbook_dir }}/../output/facts
        {{ playbook_dir }}/../output
      register: build_result

    - name: Show build script output in the job log
      debug:
        var: build_result.stdout_lines

- name: Push generated diagram to artifact server
  hosts: artifact_server
  gather_facts: no
  tasks:
    - name: Copy topology.drawio to artifact server
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../output/topology.drawio"
        dest: /home/hp/Projects/autotop-awx/topology.drawio
