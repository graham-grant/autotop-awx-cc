---
# Collects every device read-only, builds the topology diagram, and
# publishes it to a git repository (written for an internal Bitbucket).
#
#   Play 1     clone the publish repository (if `bitbucket_repo_url` is set).
#              A wrong URL, branch or credential stops the job here, before
#              any device is contacted.
#   Plays 2-4  playbooks/collect_facts.yml, unchanged: the read-only plan,
#              collection (only platforms in `collect_platforms`; dummy
#              devices work too), the audit and the JSON check. If the audit
#              or the check fails, the job stops there: nothing is built or
#              published from a run with a read-only problem.
#   Play 5     build topology.vsdx and topology.drawio with scripts/main.py,
#              using the node positions in the repository's template.vsdx,
#              and rewrite template.vsdx
#   Play 6     commit the diagram and template.vsdx to the publish
#              repository and push, if anything changed
#
# Variables (extra vars in AWX, or -e by hand):
#   bitbucket_repo_url      https URL of the repository to publish to, e.g.
#                           https://bitbucket.example.com/scm/net/topology.git
#                           with no user name or password in it.
#                           Unset: the diagram is built but not published.
#   bitbucket_branch        branch to commit to (default: main). It must
#                           already exist, with at least one commit.
#   bitbucket_path          folder in that repository for the files
#                           (default: topology; "." is the repository root).
#                           Use a different folder (or branch) for each
#                           inventory, e.g. topology-dummy and topology-dev.
#   bitbucket_ca_file       CA bundle for the server's certificate, if it is
#                           signed by an internal CA the execution
#                           environment doesn't trust
#   bitbucket_publish_facts true: also commit the facts JSON files, under
#                           <bitbucket_path>/facts/ (default: false)
#   bitbucket_publish_partial
#                           true: publish even though some inventory devices
#                           have no facts file from this run (a failed host,
#                           a platform not in collect_platforms, or --limit).
#                           Default false: such a run builds the diagram but
#                           doesn't publish it, and the job fails.
#   bitbucket_author_name / bitbucket_author_email
#                           the commit author (default: autotop AWX /
#                           autotop@localhost)
#   ...and the variables of collect_facts.yml (collect_platforms, show_facts).
#
# The repository credential comes from the job's environment, never a file,
# a URL or a command line: BITBUCKET_USERNAME and BITBUCKET_TOKEN (in AWX, a
# custom credential type: see the README). scripts/git_askpass.sh answers
# git's prompts with them.
#
# Node positions: template.vsdx in <bitbucket_path> is the position
# template. Open it in Visio, move nodes, save, and commit it back to the
# repository; the next run uses it. If the repository has none yet, the
# project's own template.vsdx is the starting point, if there is one.
#
# Usage:
#   export NET_USERNAME=admin NET_PASSWORD=secret
#   export BITBUCKET_USERNAME=svc-autotop BITBUCKET_TOKEN=...
#   ansible-playbook -i inventory.yml playbooks/gather_topology.yml \
#     -e bitbucket_repo_url=https://bitbucket.example.com/scm/net/topology.git

- name: Clone the publish repository
  hosts: localhost
  connection: local
  gather_facts: no
  vars:
    root: "{{ playbook_dir }}/.."
    publish_dir: "{{ root }}/output/publish"
    publish_path: "{{ bitbucket_path | default('topology') }}"
    publishing: "{{ (bitbucket_repo_url | default('')) | length > 0 }}"
  tasks:
    - name: Remove the clone from an earlier run
      file:
        path: "{{ publish_dir }}"
        state: absent

    # A password in the URL would be on git's command line and in this log
    - name: Check the repository URL holds no credential
      assert:
        that: bitbucket_repo_url is not regex('://[^/@]*:[^/@]*@')
        fail_msg: >-
          bitbucket_repo_url has a password or token in it. Remove it: the
          credential comes from BITBUCKET_USERNAME and BITBUCKET_TOKEN.
        quiet: true
      when: publishing | bool

    - name: Check the folder is inside the repository
      assert:
        that:
          - publish_path is not regex('^/')
          - "'..' not in publish_path.split('/')"
        fail_msg: "bitbucket_path must be a folder inside the repository, not {{ publish_path }}."
        quiet: true
      when: publishing | bool

    - name: Check the repository credential was provided
      assert:
        that:
          - lookup('env', 'BITBUCKET_USERNAME') | length > 0
          - lookup('env', 'BITBUCKET_TOKEN') | length > 0
        fail_msg: >-
          No repository credential in the job environment. In AWX, attach
          the Bitbucket credential (custom type, see the README) to this job
          template. Running by hand: export BITBUCKET_USERNAME and
          BITBUCKET_TOKEN.
        quiet: true
      when: publishing | bool and bitbucket_repo_url is regex('^https?://')

    - name: Make sure the script that answers git's prompts can run
      file:
        path: "{{ root }}/scripts/git_askpass.sh"
        mode: "0755"
      when: publishing | bool

    # BITBUCKET_USERNAME and BITBUCKET_TOKEN are already in the job's
    # environment, which git inherits. They are not repeated here: a value
    # under `environment:` is put on a command line by Ansible.
    - name: Clone the publish repository
      command: >-
        git -c credential.helper=
        {{ ('-c http.sslCAInfo=' ~ (bitbucket_ca_file | quote)) if bitbucket_ca_file is defined else '' }}
        clone --depth 1 --branch {{ bitbucket_branch | default('main') | quote }}
        {{ bitbucket_repo_url | quote }} {{ publish_dir | quote }}
      environment:
        GIT_ASKPASS: "{{ root }}/scripts/git_askpass.sh"
        GIT_TERMINAL_PROMPT: "0"
      register: clone
      changed_when: false
      failed_when: false
      when: publishing | bool

    - name: Fail if the repository couldn't be cloned
      assert:
        that: clone.rc == 0
        fail_msg: >-
          Couldn't clone {{ bitbucket_repo_url }} (branch
          {{ bitbucket_branch | default('main') }}):
          {{ clone.stderr | default('') }} {{ clone.msg | default('') }}
          Check that git is installed, the URL, that the branch exists with at least one commit,
          the Bitbucket credential and, for an internal CA, bitbucket_ca_file.
        quiet: true
      when: publishing | bool

- name: Collect, audit and check (collect_facts.yml)
  import_playbook: collect_facts.yml

- name: Build the diagram (Visio and draw.io)
  hosts: localhost
  connection: local
  gather_facts: no
  vars:
    root: "{{ playbook_dir }}/.."
    publishing: "{{ (bitbucket_repo_url | default('')) | length > 0 }}"
    # Publishing: the diagram is written straight into the clone, next to
    # the last published one, which main.py leaves alone if it is unchanged
    target_dir: "{{ root }}/output/publish/{{ bitbucket_path | default('topology') }}"
    out_dir: "{{ target_dir if publishing | bool else (root ~ '/output') }}"
    template: "{{ (target_dir ~ '/template.vsdx') if publishing | bool else (root ~ '/template.vsdx') }}"
  tasks:
    # The prebuilt scripts/_hanan.abi3.so is used as-is (no compiler needed)
    - name: Check the C extension loads
      command: python3 -c "import pathfinder; print(pathfinder._hanan.__file__)"
      args:
        chdir: "{{ root }}/scripts"
      changed_when: false

    - name: Find this run's facts files
      find:
        paths: "{{ root }}/output/facts"
        patterns: "*.json"
      register: facts_files

    - name: Note the inventory devices with no facts file from this run
      set_fact:
        missing_facts: "{{ groups['network_devices'] | difference(facts_files.files | map(attribute='path') | map('basename') | map('regex_replace', '\\.json$', '') | list) | sort }}"

    # main.py reads three things from an inventory file: each device's icon
    # and its size (w, h), and the device names, to check the shapes in
    # template.vsdx against. This writes them from the inventory this job
    # runs with, whatever file or AWX source it came from, for every device
    # (not only those collected this run).
    - name: Write the device list the diagram build reads
      copy:
        content: |
          all:
            hosts:
          {% for h in groups['network_devices'] %}
              {{ h | to_json }}:
          {% for k in ['icon', 'w', 'h'] if hostvars[h][k] is defined %}
                {{ k }}: {{ hostvars[h][k] | to_json }}
          {% endfor %}
          {% endfor %}
        dest: "{{ root }}/output/diagram-inventory.yml"
        mode: "0644"

    - name: Ensure the publish folder exists
      file:
        path: "{{ target_dir }}"
        state: directory
        mode: "0755"
      when: publishing | bool

    - name: Check for a position template in the publish repository
      stat:
        path: "{{ template }}"
      register: published_template
      when: publishing | bool

    - name: Start from the project's position template, if the repository has none
      copy:
        src: "{{ root }}/template.vsdx"
        dest: "{{ template }}"
        mode: "0644"
      when: publishing | bool and not published_template.stat.exists and (root ~ '/template.vsdx') is file

    - name: Build the diagram
      command: >-
        python3 main.py {{ (root ~ '/output/facts') | quote }} {{ out_dir | quote }}
        {{ ('--inventory=' ~ root ~ '/output/diagram-inventory.yml') | quote }}
        {{ ('--template=' ~ template) | quote }}
      args:
        chdir: "{{ root }}/scripts"
      register: build_result
      changed_when: false
      failed_when: false

    - name: Show the build output
      debug:
        msg: "{{ build_result.stdout_lines + build_result.stderr_lines }}"

    # 3: one output (a format or the template) couldn't be written. The
    # others are still published, the repository keeps its last copy of the
    # one that failed, and the job fails at the end.
    - name: Fail if the diagram couldn't be built
      assert:
        that: build_result.rc in [0, 3]
        fail_msg: >-
          main.py exited {{ build_result.rc }} - see the build output above.
          If it names shapes that don't match any host, a device was removed
          from or renamed in the inventory: delete its shape from
          template.vsdx in the publish repository.
        quiet: true

- name: Publish the diagram to the repository
  hosts: localhost
  connection: local
  gather_facts: no
  vars:
    root: "{{ playbook_dir }}/.."
    publish_dir: "{{ root }}/output/publish"
    publish_path: "{{ bitbucket_path | default('topology') }}"
    publishing: "{{ (bitbucket_repo_url | default('')) | length > 0 }}"
    complete: "{{ missing_facts | length == 0 or (bitbucket_publish_partial | default(false) | bool) }}"
    do_publish: "{{ publishing | bool and complete | bool }}"
    job_label: "{{ awx_job_id | default(tower_job_id) | default('a run by hand') }}"
  tasks:
    - name: Copy the facts files into the repository
      copy:
        src: "{{ root }}/output/facts/"
        dest: "{{ publish_dir }}/{{ publish_path }}/facts/"
        mode: "0644"
      when: do_publish | bool and (bitbucket_publish_facts | default(false) | bool)

    # New and changed files only: a diagram file that couldn't be written
    # this run is not deleted from the repository
    - name: Stage the changes
      command: git add --ignore-removal -- {{ publish_path | quote }}
      args:
        chdir: "{{ publish_dir }}"
      changed_when: false
      when: do_publish | bool

    - name: Check whether anything changed
      command: git diff --cached --name-status
      args:
        chdir: "{{ publish_dir }}"
      register: git_status
      changed_when: false
      when: do_publish | bool

    - name: Commit
      command: >-
        git -c user.name={{ bitbucket_author_name | default('autotop AWX') | quote }}
        -c user.email={{ bitbucket_author_email | default('autotop@localhost') | quote }}
        commit -q -m {{ ('Topology from AWX job ' ~ job_label) | quote }}
      args:
        chdir: "{{ publish_dir }}"
      when: do_publish | bool and git_status.stdout | length > 0

    - name: Push
      command: >-
        git -c credential.helper=
        {{ ('-c http.sslCAInfo=' ~ (bitbucket_ca_file | quote)) if bitbucket_ca_file is defined else '' }}
        push origin HEAD:{{ ('refs/heads/' ~ (bitbucket_branch | default('main'))) | quote }}
      args:
        chdir: "{{ publish_dir }}"
      environment:
        GIT_ASKPASS: "{{ root }}/scripts/git_askpass.sh"
        GIT_TERMINAL_PROMPT: "0"
      register: push
      failed_when: false
      when: do_publish | bool and git_status.stdout | length > 0

    - name: Fail if the push was refused
      assert:
        that: push.rc == 0
        fail_msg: >-
          The push to {{ bitbucket_repo_url }} was refused:
          {{ push.stderr | default('') }} {{ push.msg | default('') }}
          If someone committed to {{ bitbucket_branch | default('main') }}
          during the run (an edited template.vsdx, say), run the job again.
          Otherwise check the credential can write to the repository.
        quiet: true
      when: do_publish | bool and git_status.stdout | length > 0

    - name: Say what was published
      debug:
        msg: >-
          {% if not publishing | bool %}Not published: bitbucket_repo_url is not set. The files are in output/, in this job only.
          {% elif not complete | bool %}Not published: no facts file from this run for {{ missing_facts | join(', ') }}.
          {% elif git_status.stdout | length == 0 %}Nothing changed since the last publish, so there is nothing to commit.
          {% else %}Published to {{ bitbucket_repo_url }}, branch {{ bitbucket_branch | default('main') }}: {{ git_status.stdout_lines | map('regex_replace', '\s+', ' ') | join(', ') }}
          {% endif %}

    - name: Fail the job if the diagram is incomplete and wasn't published
      assert:
        that: complete | bool
        fail_msg: >-
          Not published: {{ missing_facts | join(', ') }} had no facts file
          from this run, so the diagram and the position template would
          leave them out. Fix those hosts (or widen collect_platforms), or
          set bitbucket_publish_partial=true to publish anyway.
        quiet: true
      when: publishing | bool

    - name: Fail the job if a diagram file or the template couldn't be written
      assert:
        that: build_result.rc == 0
        fail_msg: "An output couldn't be written (the others were published) - see the build output above."
        quiet: true
